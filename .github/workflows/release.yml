name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - run: uv python install 3.12

      - name: Tag, pyproject and server.json versions must agree
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          SJ=$(jq -r .version server.json)
          SJPKG=$(jq -r '.packages[0].version' server.json)
          echo "tag=$TAG pyproject=$PKG server.json=$SJ server.json pkg=$SJPKG"
          [ "$TAG" = "$PKG" ] && [ "$PKG" = "$SJ" ] && [ "$SJ" = "$SJPKG" ]

      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      # Includes tests/test_release_metadata.py, which also checks the tag on a tag push.
      - run: uv run pytest -q
      - run: uv build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi          # approval gate + matches the PyPI trusted publisher
    permissions:
      id-token: write          # OIDC to PyPI, and signing the attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      # PEP 740 attestations: uv publish does not generate them, but uploads any
      # dist/*.publish.attestation it finds (uv docs, "Uploading attestations with your
      # package"; the GitHub integration guide uses this action).
      - uses: astral-sh/attest-action@39b6ce43875c196a579e31635b11aa2a2036384a # v0.0.7
      - run: uv publish --trusted-publishing always

  publish-registry:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write          # OIDC to the MCP Registry
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Wait for the version to appear on PyPI
        run: |
          V="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 20); do
            curl -fsS "https://pypi.org/pypi/mcp-supply-audit/$V/json" >/dev/null && exit 0
            sleep 15
          done
          echo "PyPI never showed $V"; exit 1

      # Pinned release, verified against its published SHA-256 (registry_<version>_checksums.txt).
      # ubuntu-latest is x86_64; bump the version and checksum together.
      - name: Install mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.7
          MCP_PUBLISHER_SHA256: 00b21004149a4ce66f0782508ae4a2bce67d1bea395a8da0bd8028159fb59579
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum --check --strict
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
