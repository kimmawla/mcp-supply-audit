# RG011: query parameter names whose value is a credential in a remote MCP URL.
# Matched against the whole parameter name, case-insensitively, after percent-decoding and
# removing hidden characters. Only names that nearly always carry a secret are listed, so
# pagination (page, cursor, page_token), cache and session identifiers do not match.
# Reviewed 2026-11-02.
version: 1
names:
  - token            # bearer or API token
  - access_token     # OAuth 2.0 access token in its query form (RFC 6750)
  - id_token         # OpenID Connect ID token, a signed JWT
  - refresh_token    # OAuth 2.0 refresh token; long-lived
  - auth_token       # common vendor name for an API token
  - api_key          # API key
  - apikey           # API key, no separator
  - api-key          # API key, hyphenated
  - client_secret    # OAuth client secret
  - secret           # generic secret value
  - password         # password
  - passwd           # password, Unix spelling
  - authorization    # an Authorization header value moved into the query
  - sig              # signed-URL signature (e.g. Azure SAS); grants access until it expires
  - signature        # signed-URL signature
  - x-amz-signature  # AWS SigV4 presigned-URL signature
# Removed in review: "key" (also names cache, sort and lookup keys; Google APIs' ?key= API
# keys are missed as a result), "session" (session ids are usually not secrets), "auth"
# (often a mode flag such as auth=none).
