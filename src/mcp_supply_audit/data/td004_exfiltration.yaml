# TD004: exfiltration phrasing in a description. URLs with a scheme are found by pattern
# in code; bare domains (OSV.dev) are not flagged. Phrases use the TD002 matching rules.
# Aim at moving conversation content or secrets somewhere, not at ordinary verbs:
# "Post a comment to the issue" and "Upload a file to the bucket" are benign.
version: 1
phrases:
  - send the conversation
  - send the chat
  - send the contents
  - send the full
  - send a copy
  - send all
  - send it to
  - send them to
  - send this to
  - post the conversation
  - post the contents
  - upload the conversation
  - upload the contents
  - forward the conversation
  - forward the contents
  - forward all
  - exfiltrate
  - include the full conversation
  - include the contents of
  - append the conversation
  - to this webhook
  - to the following url
  - to this url
  - to this endpoint
  - to the following endpoint

# Send-to construction (docs/rules-tool-definitions.md, TD004 detail): a send verb, up to
# three words, an object below, up to three words, "to", then any destination word.
# Base forms only: "Posts the output to a channel" describes the tool, not an instruction.
send_verbs:
  - send
  - forward
  - post
send_objects:
  - conversation
  - conversations
  - chat
  - chats
  - history
  - histories
  - context
  - contexts
  - output
  - outputs
  - credentials
  - credential
  - token
  - tokens
  - system prompt
  - system prompts
