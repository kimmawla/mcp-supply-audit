# TD004: exfiltration phrasing in a description. URLs with a scheme are found by pattern
# in code; bare domains (OSV.dev) are not flagged. Phrases use the TD002 matching rules.
# Aim at moving conversation content or secrets somewhere, not at ordinary verbs:
# "Post a comment to the issue" and "Upload a file to the bucket" are benign.
version: 1
phrases:
  - send the conversation
  - send the chat
  - send the contents
  - send the full
  - send a copy
  - send all
  - send it to
  - send them to
  - send this to
  - post the conversation
  - post the contents
  - upload the conversation
  - upload the contents
  - forward the conversation
  - forward the contents
  - forward all
  - exfiltrate
  - include the full conversation
  - include the contents of
  - append the conversation
  - to this webhook
  - to the following url
  - to this url
  - to this endpoint
  - to the following endpoint
